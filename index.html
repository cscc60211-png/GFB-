<!-- ===== زر واتساب العائم ===== -->
<a href="https://wa.me/213696618438" class="wa-float" data-wa="مرحباً GFB Constantine، أرغب في التواصل معكم." target="_blank" rel="noopener" aria-label="تواصل عبر واتساب">
  <svg class="icon icon-fill"><use href="#i-wa"/></svg>
</a>

<script>
/* ============================================================
   1) إعداد روابط الواتساب برسائل مُعدّة مسبقاً
============================================================ */
const WA_NUMBER = '213696618438';
document.querySelectorAll('[data-wa]').forEach(link => {
  const msg = link.getAttribute('data-wa');
  link.href = https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)};
});

/* ============================================================
   2) قائمة الموبايل (فتح/إغلاق + تحويل الأيقونة إلى X)
============================================================ */
const navToggle = document.getElementById('navToggle');
const mainNav   = document.getElementById('mainNav');

navToggle.addEventListener('click', () => {
  const open = mainNav.classList.toggle('open');
  navToggle.classList.toggle('active', open);
  navToggle.setAttribute('aria-label', open ? 'إغلاق القائمة' : 'فتح القائمة');
});
mainNav.querySelectorAll('a').forEach(a =>
  a.addEventListener('click', () => {
    mainNav.classList.remove('open');
    navToggle.classList.remove('active');
  })
);

/* ============================================================
   3) ظل الترويسة عند التمرير
============================================================ */
const header = document.getElementById('siteHeader');
addEventListener('scroll', () => {
  header.classList.toggle('scrolled', scrollY > 10);
}, { passive: true });

/* ============================================================
   4) تأثير الظهور عند التمرير (Reveal)
============================================================ */
const revealObs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      e.target.classList.add('visible');
      revealObs.unobserve(e.target);
    }
  });
}, { threshold: 0.15 });
document.querySelectorAll('.reveal').forEach(el => revealObs.observe(el));

/* ============================================================
   5) تمييز الرابط النشط أثناء التمرير (Scroll Spy)
============================================================ */
const navLinks = document.querySelectorAll('.nav-link');
const spy = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      navLinks.forEach(l =>
        l.classList.toggle('active', l.getAttribute('href') === '#' + e.target.id)
      );
    }
  });
}, { rootMargin: '-40% 0px -55% 0px' });
document.querySelectorAll('section[id]').forEach(s => spy.observe(s));

/* ============================================================
   6) عدّادات الإحصائيات المتحركة
============================================================ */
const counterObs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (!e.isIntersecting) return;
    const el = e.target;
    counterObs.unobserve(el);

    const target = +el.dataset.target;
    const prefix = el.dataset.prefix || '';
    const suffix = el.dataset.suffix || '';
    const dur = 1600;
    const t0  = performance.now();

    const tick = now => {
      const p     = Math.min((now - t0) / dur, 1);
      const eased = 1 - Math.pow(1 - p, 3); // تباطؤ ناعم في النهاية
      el.textContent = prefix + Math.round(target * eased) + suffix;
      if (p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}, { threshold: 0.6 });
document.querySelectorAll('.stat-num').forEach(el => counterObs.observe(el));
</script>
</body>
</html>
`
